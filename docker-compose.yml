services:
  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    expose:
      - "8000"
    networks:
      - shofy-net
    restart: unless-stopped

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - shofy-net
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shofy-net
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  shofy-net:
    driver: bridge
